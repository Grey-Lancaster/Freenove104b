; Shared base environment for all Freenove FNK0104B tutorial chapters.
; Included by each NN_Name/platformio.ini via `extra_configs`, then pulled in
; locally with `extends = env:base`. Keeps the ESP32-S3-WROOM-1-N16R8
; board/platform/framework settings (and any per-chapter additions) in one place
; instead of duplicated across every chapter folder.
;
; Board def note: the generic esp32-s3-devkitc-1 board defaults to "No PSRAM"
; and crashes (Guru Meditation StoreProhibited) on boot if PSRAM is forced on
; via a plain build flag instead of a matching board def -- see
; ../boards/ESP32-S3-WROOM-1-N16R8.json (reused from a prior project that
; already solved this for this exact module).

[env:base]
platform = espressif32@6.10.0
board = ESP32-S3-WROOM-1-N16R8
framework = arduino
monitor_speed = 115200
board_build.partitions = default_16MB.csv
; Freenove's own Arduino libraries (WS2812, FT6336U touch, audio codec, LVGL,
; TJpg_Decoder), extracted from the .zip files Freenove ships and vendored here
; so every chapter's LDF can find them by #include without a per-sketch copy.
lib_extra_dirs = ../lib_freenove
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.3
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Freenove's Arduino board manager package normally auto-defines this
    ; per selected board variant (2.8" ILI9341 = FNK0104AB); tutorial source
    ; files (esp. lv_img.cpp's per-variant image data arrays) rely on it
    ; being defined globally, not just via a local #define in the top-level
    ; .ino. We're not using their board package, so it's defined here
    ; instead, for every chapter.
    -DFNK0104AB_2P8_240x320_ILI9341=1

; --- Shared base for chapters that drive the ILI9341 TFT (+ FT6336U touch) ---
; TFT_eSPI panel config, pins, and gotchas confirmed working on this exact
; FNK0104B board in a prior project -- see project memory for the full
; writeup of why each of these is needed (USE_HSPI_PORT must NOT be defined,
; lib_deps must point at TFT_eSPI's master branch not the registry tag, at
; least one LOAD_* font flag is required or tft.print() silently draws
; nothing, etc).
[env:tft_base]
extends = env:base
lib_deps =
    ${env:base.lib_deps}
    https://github.com/Bodmer/TFT_eSPI.git
build_flags =
    ${env:base.build_flags}
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_ON=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=13
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=46
    -DTFT_RST=-1
    -DTFT_BL=45
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=40000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DTOUCH_SDA=16
    -DTOUCH_SCL=15
    -DTOUCH_RST=18
    -DTOUCH_INT=17

; --- Shared base for the LVGL chapters (13-19) ---
; lv_conf.h reused as-is from the sibling `translate` project (LV_COLOR_16_SWAP=0
; matches this board, LV_TICK_CUSTOM wired to millis()) plus LV_USE_DEMO_WIDGETS
; and a bumped LV_MEM_SIZE for this project's later chapters; shared here via
; -I../include since each chapter is its own PlatformIO project dir.
; LVGL itself is vendored (lib_freenove/lvgl, from Freenove's own zip) rather
; than pulled from the registry: the registry package doesn't include the
; demos/examples folders under src/ (Arduino-style builds only auto-compile
; files under a library's src/), so chapter 19's lv_demo_widgets() link-fails
; against it. The vendored copy has demos/ and examples/ copied into src/
; (per LVGL's own Arduino setup instructions) and its bundled template
; lv_conf.h deleted so it can't shadow our shared one.
[env:lvgl_base]
extends = env:tft_base
build_flags =
    ${env:tft_base.build_flags}
    -I../include
    -DLV_CONF_INCLUDE_SIMPLE
